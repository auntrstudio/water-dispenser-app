<!DOCTYPE html>

      max-width: 420px;

    .icon {

    .app-name {

      font-weight: 700;
      color: #202124;

      margin-bottom: 32px;
      line-height: 1.5;

    .features {
      text-align: left;
      margin-bottom: 36px;
      display: flex;
      flex-direction: column;

      align-items: flex-start;

      flex-shrink: 0;
      margin-top: 1px;
    }

    .btn-appstore {
      display: inline-block;
      background: #000000;
      color: #ffffff;
      text-decoration: none;
      border-radius: 14px;
      padding: 14px 32px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.2px;
      transition: opacity 0.2s;
      margin-bottom: 24px;
    }

    .btn-appstore:hover { opacity: 0.85; }

    .btn-appstore .small {
      display: block;
      font-size: 10px;
      font-weight: 400;
      opacity: 0.8;
      margin-bottom: 2px;
    }

    .links {
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .links a {
      font-size: 12px;
      color: #1a73e8;
      text-decoration: none;
    }

    .links a:hover { text-decoration: underline; }

    .badge {

      background: #e8f0fe;
